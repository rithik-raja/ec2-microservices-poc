name: Backend Deploy (SSM + PM2)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  S3_DEPLOY_BUCKET: ${{ secrets.S3_DEPLOY_BUCKET }}

jobs:
  deploy:
    name: Deploy ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth-service
            workspace: auth-service
            instance_id_secret: AUTH_EC2_INSTANCE_ID
            service_dir_secret: AUTH_SERVICE_DIR
          - name: post-service
            workspace: post-service
            instance_id_secret: POST_EC2_INSTANCE_ID
            service_dir_secret: POST_SERVICE_DIR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build --workspace ${{ matrix.service.workspace }}

      - name: Package artifact
        run: |
          mkdir -p out
          cp package-lock.json apps/backend/${{ matrix.service.workspace }}/package-lock.json
          tar -czf out/${{ matrix.service.name }}.tar.gz \
            -C apps/backend/${{ matrix.service.workspace }} \
            dist package.json package-lock.json
          rm apps/backend/${{ matrix.service.workspace }}/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload artifact to S3
        env:
          ARTIFACT_KEY: ${{ matrix.service.name }}/${{ github.sha }}-${{ github.run_id }}.tar.gz
        run: |
          aws s3 cp out/${{ matrix.service.name }}.tar.gz s3://${S3_DEPLOY_BUCKET}/${ARTIFACT_KEY}
          echo "ARTIFACT_KEY=${ARTIFACT_KEY}" >> "$GITHUB_ENV"

      - name: Deploy service through SSM
        env:
          INSTANCE_ID: ${{ secrets[matrix.service.instance_id_secret] }}
          SERVICE_DIR: ${{ secrets[matrix.service.service_dir_secret] }}
          PM2_PROCESS_NAME: ${{ matrix.service.name }}
        run: |
          read -r -d '' SCRIPT_CONTENT << 'EOF' || true
          set -euo pipefail
          mkdir -p $SERVICE_DIR
          aws s3 cp s3://${S3_DEPLOY_BUCKET}/${ARTIFACT_KEY} /tmp/${PM2_PROCESS_NAME}.tar.gz
          tar -xzf /tmp/${PM2_PROCESS_NAME}.tar.gz -C $SERVICE_DIR
          cd $SERVICE_DIR
          npm ci --omit=dev
          if pm2 describe $PM2_PROCESS_NAME >/dev/null 2>&1; then
            pm2 reload $PM2_PROCESS_NAME --update-env
          else
            pm2 start dist/index.js --name $PM2_PROCESS_NAME
          fi
          pm2 save
          EOF

          SCRIPT_CONTENT=$(echo "$SCRIPT_CONTENT" | sed \
            -e "s|\$SERVICE_DIR|$SERVICE_DIR|g" \
            -e "s|\${S3_DEPLOY_BUCKET}|$S3_DEPLOY_BUCKET|g" \
            -e "s|\${ARTIFACT_KEY}|$ARTIFACT_KEY|g" \
            -e "s|\${PM2_PROCESS_NAME}|$PM2_PROCESS_NAME|g" \
            -e "s|\$PM2_PROCESS_NAME|$PM2_PROCESS_NAME|g")

          PAYLOAD=$(jq -n \
            --arg instance "$INSTANCE_ID" \
            --arg comment "Deploy $PM2_PROCESS_NAME from GitHub Actions" \
            --arg script "$SCRIPT_CONTENT" \
            '{
              InstanceIds: [$instance],
              DocumentName: "AWS-RunShellScript",
              Comment: $comment,
              Parameters: { commands: [$script] }
            }')

          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json "$PAYLOAD" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"