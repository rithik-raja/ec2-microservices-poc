name: Backend Deploy (SSM + PM2)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  S3_DEPLOY_BUCKET: ${{ secrets.S3_DEPLOY_BUCKET }}

jobs:
  deploy:
    name: Deploy Backend Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: auth-service
            workspace: auth-service
            instance_id: ${{ secrets.AUTH_EC2_INSTANCE_ID }}
            service_dir: ${{ secrets.AUTH_SERVICE_DIR }}
          - name: post-service
            workspace: post-service
            instance_id: ${{ secrets.POST_EC2_INSTANCE_ID }}
            service_dir: ${{ secrets.POST_SERVICE_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build --workspace ${{ matrix.service.workspace }}

      - name: Package artifact
        run: |
          mkdir -p out
          tar -czf out/${{ matrix.service.name }}.tar.gz \
            -C apps/backend/${{ matrix.service.workspace }} \
            dist package.json package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload artifact to S3
        env:
          ARTIFACT_KEY: ${{ matrix.service.name }}/${{ github.sha }}-${{ github.run_id }}.tar.gz
        run: |
          aws s3 cp out/${{ matrix.service.name }}.tar.gz s3://${S3_DEPLOY_BUCKET}/${ARTIFACT_KEY}
          echo "ARTIFACT_KEY=${ARTIFACT_KEY}" >> "$GITHUB_ENV"

      - name: Deploy service through SSM
        env:
          INSTANCE_ID: ${{ matrix.service.instance_id }}
          SERVICE_DIR: ${{ matrix.service.service_dir }}
          PM2_PROCESS_NAME: ${{ matrix.service.name }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $PM2_PROCESS_NAME from GitHub Actions" \
            --parameters commands="set -euo pipefail
          mkdir -p ${SERVICE_DIR}
          aws s3 cp s3://${S3_DEPLOY_BUCKET}/${ARTIFACT_KEY} /tmp/${PM2_PROCESS_NAME}.tar.gz
          tar -xzf /tmp/${PM2_PROCESS_NAME}.tar.gz -C ${SERVICE_DIR}
          cd ${SERVICE_DIR}
          npm ci --omit=dev
          if pm2 describe ${PM2_PROCESS_NAME} >/dev/null 2>&1; then
            pm2 reload ${PM2_PROCESS_NAME} --update-env
          else
            pm2 start dist/index.js --name ${PM2_PROCESS_NAME}
          fi
          pm2 save" \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"